<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan & Listen</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f3f4f6;
            text-align: center;
        }
        .btn {
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background-color: #2563eb;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        p { color: #4b5563; max-width: 80%; font-size: 18px; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- A large interactive element satisfies the browser interaction requirement -->
    <button class="btn" id="playBtn">🔊 Tap to Listen</button>
    <p id="displayText">Loading your message...</p>

    <script>
        // 1. Get the text from the URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const textToSpeak = urlParams.get('text') || "No text was provided in the URL.";

        // 2. Display the text on the screen so they can read along
        document.getElementById('displayText').innerText = textToSpeak;

        // 3. Trigger the text-to-speech engine on click
        document.getElementById('playBtn').addEventListener('click', () => {
            // Check if SpeechSynthesis is supported
            if ('speechSynthesis' in window) {
                // Cancel any ongoing speech
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                
                // Optional: Customize voice properties
                utterance.rate = 1.0; // Speed (0.1 to 10)
                utterance.pitch = 1.0; // Pitch (0 to 2)

                window.speechSynthesis.speak(utterance);
            } else {
                alert("Sorry, your browser does not support text-to-speech.");
            }
        });
    </script>
</body>
</html>
