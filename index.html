<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Text-to-Speech Generator</title>
    <!-- Include QR Code library via CDN -->
    <script src="qrcode.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 { font-size: 24px; color: #1f2937; margin-bottom: 20px; }
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 5px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }
        .range-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #2563eb;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        .btn:hover { background-color: #1d4ed8; }
        .btn-secondary {
            background-color: #10b981;
            margin-top: 15px;
        }
        .btn-secondary:hover { background-color: #059669; }
        #qr-result-box {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #e5e7eb;
            display: none;
            flex-direction: column;
            align-items: center;
        }
        #qrcode {
            padding: 10px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <h1 id="page-title">🔊 QR Audio Player</h1>

    <!-- SECTION 1: SCANNER MODE (Shows up when someone scans the code) -->
    <div id="player-mode" class="hidden">
        <button class="btn" id="playBtn">🔊 Tap to Listen</button>
        <div class="form-group" style="margin-top: 20px;">
            <label>Message Content:</label>
            <p id="displayText" style="background:#f9fafb; padding:15px; border-radius:8px; margin:0; text-align:left; color:#374151; font-size:16px; line-height:1.5;"></p>
        </div>
        <button class="btn btn-secondary" onclick="window.location.search = ''">Create Your Own QR Code</button>
    </div>

    <!-- SECTION 2: GENERATOR MODE (Shows up normally to create codes) -->
    <div id="generator-mode">
        <div class="form-group">
            <label for="textInput">Your Message</label>
            <textarea id="textInput" rows="3" placeholder="Enter the text you want the QR code to read aloud..."></textarea>
        </div>

        <div class="form-group">
            <label for="voiceSelect">Target Voice/Language</label>
            <select id="voiceSelect"><option value="">Loading system voices...</option></select>
        </div>

        <div class="form-group">
            <label for="paceInput">Speech Pace: <span id="paceVal">1.0</span>x</label>
            <div class="range-container">
                <input type="range" id="paceInput" min="0.5" max="2" step="0.1" value="1.0">
            </div>
        </div>

        <button class="btn" id="testBtn">🔊 Test Audio Sound</button>
        <button class="btn btn-secondary" id="generateBtn">🛠️ Generate QR Code</button>

        <!-- QR Code Output Block -->
        <div id="qr-result-box">
            <label style="text-align: center; margin-bottom: 10px;">Your Printable QR Code:</label>
            <div id="qrcode"></div>
            <p style="font-size: 12px; color: #6b7280; margin: 5px 0 15px 0;">Right-click the QR code image above to save or copy it.</p>
        </div>
    </div>
</div>

<script>
    const synth = window.speechSynthesis;
    let voices = [];

    // Elements
    const generatorMode = document.getElementById('generator-mode');
    const playerMode = document.getElementById('player-mode');
    const voiceSelect = document.getElementById('voiceSelect');
    const paceInput = document.getElementById('paceInput');
    const paceVal = document.getElementById('paceVal');
    const textInput = document.getElementById('textInput');
    const displayText = document.getElementById('displayText');
    const qrcodeContainer = document.getElementById('qrcode');
    const qrResultBox = document.getElementById('qr-result-box');

    // 1. POPULATE SUPPORTED SYSTEM VOICES
    function populateVoiceList() {
        if (typeof synth === 'undefined') return;
        voices = synth.getVoices();
        
        // Clear placeholder
        voiceSelect.innerHTML = '';
        
        voices.forEach((voice, index) => {
            const option = document.createElement('option');
            option.textContent = `${voice.name} (${voice.lang})`;
            option.value = index;
            // Default to English or the system primary standard
            if (voice.default) option.selected = true;
            voiceSelect.appendChild(option);
        });
    }

    populateVoiceList();
    if (synth.onvoiceschanged !== undefined) {
        synth.onvoiceschanged = populateVoiceList;
    }

    // Update range visual value
    paceInput.addEventListener('input', () => paceVal.textContent = paceInput.value);

    // 2. CHECK MODE ON PAGE LOAD (Read Query String Parameters)
    const urlParams = new URLSearchParams(window.location.search);
    const paramText = urlParams.get('text');
    const paramVoiceIndex = urlParams.get('voice');
    const paramPace = urlParams.get('pace');

    if (paramText !== null) {
        // Switch layout to Receiver/Player mode
        generatorMode.classList.add('hidden');
        playerMode.classList.remove('hidden');
        document.getElementById('page-title').textContent = "🔊 Scan Successful!";
        displayText.textContent = decodeURIComponent(paramText);

        // Audio trigger setup for scanner user
        document.getElementById('playBtn').addEventListener('click', () => {
            synth.cancel(); // Reset engine
            const utterance = new SpeechSynthesisUtterance(paramText);
            
            // Re-fetch system voices to make sure index maps correctly on current phone/device
            const deviceVoices = synth.getVoices();
            if (paramVoiceIndex && deviceVoices[paramVoiceIndex]) {
                utterance.voice = deviceVoices[paramVoiceIndex];
            }
            if (paramPace) {
                utterance.rate = parseFloat(paramPace);
            }
            synth.speak(utterance);
        });
    }

    // 3. GENERATOR ACTIONS (Testing Audio locally)
    document.getElementById('testBtn').addEventListener('click', () => {
        if (!textInput.value.trim()) return alert("Please enter text to test.");
        synth.cancel();
        const utterance = new SpeechSynthesisUtterance(textInput.value);
        if (voiceSelect.value) utterance.voice = voices[voiceSelect.value];
        utterance.rate = parseFloat(paceInput.value);
        synth.speak(utterance);
    });

    // 4. GENERATOR ACTIONS (Creating the QR Code URL Link)
    document.getElementById('generateBtn').addEventListener('click', () => {
        const text = textInput.value.trim();
        if (!text) return alert("Please type a message first.");

        // Clear previous QR Code if any
        qrcodeContainer.innerHTML = "";

        // Build target payload URL pointing right back to this hosted file location
        const baseUrl = window.location.origin + window.location.pathname;
        const targetUrl = `${baseUrl}?text=${encodeURIComponent(text)}&voice=${voiceSelect.value}&pace=${paceInput.value}`;

        // Create the QR Code Graphic using the library
        new QRCode(qrcodeContainer, {
            text: targetUrl,
            width: 200,
            height: 200,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        qrResultBox.style.display = "flex";
        qrResultBox.scrollIntoView({ behavior: 'smooth' });
    });
</script>

</body>
</html>
